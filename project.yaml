manifest_version: 2
id: 20
name: outbox-pattern
program:
  id: backend-reliability-platform
  narrative_fit: Guarantees that committed commerce events survive process and broker failures before saga or downstream consumers act on them
  related_repositories:
    - spring-hexagonal-payments
    - event-sourcing-orders
    - saga-orchestrator
    - cache-strategies-bench
  shared_assets:
    - contracts/commerce-event-v1.schema.json
    - transactional-outbox-failure-harness
status: implemented-awaiting-fresh-evidence
claim: A real PostgreSQL transactional outbox reaches a Kafka-compatible consumer with zero message loss under process and broker failures
stack:
  language: java21
  framework: spring-boot-3.4
  persistence: spring-jdbc-postgresql-17
  migrations: flyway
  messaging: kafka-clients-redpanda-26
  testing: junit5-testcontainers
  runtime: docker-compose
language_profile:
  primary: java
  secondary: [sql, powershell]
  reason: Java and Spring expose the enterprise transaction boundary while SQL keeps locking and retry semantics reviewable
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: default-portfolio-project
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker-compose-postgresql-redpanda
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: completed
  principles:
    coupling_rule: Domain and application code do not import Spring, JDBC, Kafka, Docker, cloud SDKs, or HTTP
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: One service, one database, one broker, explicit SQL, and no ORM are sufficient for this reliability claim
    testability_rule: Use cases run against ports; PostgreSQL behavior is covered by Testcontainers and the Compose benchmark
    failure_semantics: At-least-once transport plus consumer idempotency; no exactly-once transport claim
    rejected_overengineering:
      - Distributed transaction or two-phase commit
      - Kubernetes for a local reliability benchmark
      - ORM abstraction over the claim-critical locking SQL
  stack_profile: spring-java-reliability
  api_style: rest-http
  messaging: transactional-outbox-kafka
  cloud:
    mode: local-first
    local_provider: docker-compose
    real_provider_target: managed-postgresql-and-kafka-compatible-broker
    adapter_rule: EventPublisher and persistence ports isolate provider-specific clients
    config_switch: DATABASE_URL and KAFKA_BOOTSTRAP_SERVERS
  database: postgresql-17.6
  runtime: docker-compose
  library_policy: Spring JDBC, Flyway, PostgreSQL JDBC, Kafka client, Jackson, NetworkNT JSON Schema, JUnit, Testcontainers
  record_path: sdd/technical-decision.md
architecture:
  style: hexagonal
  reason: Transaction, outbox claim, broker publish, and idempotency are independently replaceable boundaries
  dependency_rule: infrastructure -> application ports -> domain
  boundaries:
    - application/port/OrderTransaction -> infrastructure/JdbcOutboxAdapter
    - application/port/OutboxStore -> infrastructure/JdbcOutboxAdapter
    - application/port/EventPublisher -> infrastructure/KafkaMessagePublisher
    - application/port/ProcessedEventStore -> infrastructure/JdbcOutboxAdapter
contract:
  name: commerce-event-v1
  path: contracts/commerce-event-v1.schema.json
  delivery: kafka-compatible
benchmark:
  id: transactional-outbox-failure-recovery
  command: powershell -NoProfile -ExecutionPolicy Bypass -File tools/benchmark.ps1
  result_path: benchmarks/results/outbox-benchmark-v2.json
  repetitions: 3
  concurrency: 3
  primary_metric: lost_messages
  target: 0
  secondary_metrics: [duplicates, publish_lag_p95, retry_count]
  real_dependencies: [postgresql, redpanda]
  failure_scenarios:
    - hard JVM halt after database commit and before publish
    - unreachable Kafka bootstrap endpoint
    - publish succeeds but acknowledgement is lost before database status update
release:
  docker: compose
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
  fresh_artifact_required: true
