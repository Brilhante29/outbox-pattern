id: 20
name: outbox-pattern
program:
  id: backend-reliability-platform
  narrative_fit: Proves transactional outbox pattern prevents message loss under system failure
  shared_assets:
    - outbox-benchmark-harness
status: implemented
claim: outbox transacional
stack:
  - java21
  - spring-boot
  - postgresql
  - redpanda
  - docker
language_profile:
  primary: java
  secondary: []
  reason: Java/Spring Boot is the standard stack for enterprise transactional patterns
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: default-portfolio-project
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker+kumo-when-cloud-behavior-is-needed
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: completed
  principles:
    coupling_rule: Domain/use cases do not depend on framework, database, broker, cloud SDK, transport, or UI
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: In-memory stores simulate DB and broker; no external infrastructure needed
    testability_rule: Use cases run without transport/infrastructure via port/adapter fakes
    rejected_overengineering:
      - JPA/Hibernate (in-memory map is sufficient for benchmark)
      - Real PostgreSQL/Redpanda containers (would slow benchmark)
  stack_profile: spring-kotlin-backend
  api_style: rest-http
  messaging: outbox-only
  cloud:
    mode: none
    local_provider: none
    real_provider_target: none
    emulated_services: []
    adapter_rule: ports/adapters keep cloud SDK outside domain/use cases
    config_switch: none
    unsupported_behaviors: []
  database: none (in-memory)
  runtime: docker
  library_policy: Spring Boot 3.4 + Jackson for JSON; minimal dependencies for benchmark speed
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: Spring Data JPA + PostgreSQL
      reason: Adds latency and complexity for benchmark; in-memory suffices
architecture:
  style: hexagonal
  reason: Outbox pattern ports (OutboxRepository, MessagePublisher) naturally align with hexagonal architecture's port/adapter separation
  problem_forces:
    domain_complexity: low
    integration_pressure: low
    ui_state_complexity: none
    data_or_ml_reproducibility: none
    auditability: low
    throughput_or_async: medium
    independent_deployability: none
  dependency_rule: Domain and application layers depend only on abstractions (ports); infrastructure implements ports
  boundaries:
    - domain/ports -> infrastructure/adapters
  rejected_alternatives:
    - style: mvc
      reason: Does not emphasize port/adapter separation needed for outbox pattern
design_system:
  tokens: design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_card
    - architecture_card
    - references_table
  diagram_required: false
reuse:
  kit_version: local
  uses:
    - catalog
    - programs
    - proficiency-map
    - component-packs
    - openspec-schema
    - decision-brain
    - agent-graph
    - reuse-improvement-loop
    - architecture
    - language-profiles
    - design-system
    - sdd
    - harness
    - templates
    - skills
benchmark:
  primary_metric: lost_messages_under_failure
  unit: messages
  command: docker run --rm outbox-pattern benchmark
  result_path: benchmarks/results/*.json
release:
  docker: built
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
