spring.application.name=outbox-pattern
server.port=8080
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/outbox}
spring.datasource.username=${DATABASE_USER:outbox}
spring.datasource.password=${DATABASE_PASSWORD:outbox}
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:12}
spring.flyway.enabled=true
spring.flyway.validate-migration-naming=true
outbox.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
outbox.kafka.topic=${OUTBOX_TOPIC:commerce.order-events.v1}
outbox.worker.batch-size=${OUTBOX_BATCH_SIZE:25}
outbox.worker.lease-ms=${OUTBOX_LEASE_MS:10000}
