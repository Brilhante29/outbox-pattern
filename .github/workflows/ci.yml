name: CI

on:
  push:
    branches: [main, "codex/**", "agent/**"]
  pull_request:
    branches: [main, "codex/**", "agent/**"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.4

      - name: Unit and PostgreSQL integration tests
        run: ./gradlew test --no-daemon

      - name: Run real PostgreSQL and Redpanda benchmark
        shell: pwsh
        run: |
          ./tools/benchmark.ps1 `
            -Producer github-actions `
            -CiRunUrl "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Validate repository and regenerated evidence
        shell: pwsh
        run: ./tools/validate-project.ps1 -SkipDocker

      - name: Upload benchmark result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-result
          path: benchmarks/results/outbox-benchmark-v2.json
          if-no-files-found: error

      - name: Stop local-first services
        if: always()
        run: docker compose down --volumes --remove-orphans
